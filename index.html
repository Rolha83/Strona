<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karta Odpowiedzi – Konkurs Matematyczny Leon</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-border: #86efac;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Lewy panel – Podgląd pliku PDF */
        .pdf-viewer-container {
            flex: 1;
            border-right: 1px solid var(--border);
            background-color: #525659;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #323639;
            color: #fff;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .toolbar select {
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            border: none;
            background: #fff;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            max-width: 100%;
        }

        .pdf-viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Prawy panel – Karta odpowiedzi */
        .answer-card {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow-y: auto;
            background-color: var(--card-bg);
        }

        .student-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.2rem;
            padding: 0.8rem;
            background: #f1f5f9;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .student-info input {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .question-item {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-item.correct {
            background-color: #dcfce7;
            border-color: #86efac;
        }

        .question-item.incorrect {
            background-color: #fee2e2;
            border-color: #fca5a5;
        }

        .question-item label.q-num {
            font-weight: 600;
            font-size: 0.9rem;
            min-width: 80px;
        }

        .options {
            display: flex;
            gap: 0.8rem;
        }

        .options label {
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* Sekcja wyników AI */
        #ai-result {
            margin-top: 1.2rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }

        .result-success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
            font-style: italic;
            color: #64748b;
        }

        .details-list {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px dashed var(--success-border);
            padding-top: 0.5rem;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .pdf-viewer-container {
                height: 45vh;
            }
        }
    </style>
</head>
